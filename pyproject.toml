[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autopilot-jobhunt"
version = "0.4.4"
description = "Personal job radar: direct ATS adapters, Gemini scoring, SQLite memory, CSV output. Drafts only; never applies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["job-search", "ats", "automation", "mcp", "llm", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Topic :: Office/Business",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "google-genai>=2.28.0",
    "pyyaml>=6.0",  # discover / harvest read india.yml (T66)
]

[project.optional-dependencies]
mcp = ["mcp>=1.9,<2"]
claude = ["anthropic>=0.30.0"]
gemini = []  # kept so `pip install .[gemini]` still works; google-genai is a core dependency now
dev = ["pytest>=8.0", "pytest-cov>=4.0", "ruff>=0.4", "mypy>=1.8", "mcp>=1.9,<2"]

[project.scripts]
autopilot = "job_hunt.main:main"
# Alias matching the PyPI distribution name so MCP-registry runners that derive
# the executable from the package name (e.g. `uvx autopilot-jobhunt mcp`, per
# server.json packageArguments) resolve to a real command.
autopilot-jobhunt = "job_hunt.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["job_hunt"]
include = ["job_hunt/data/**"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["job_hunt"]

[tool.coverage.run]
source = ["job_hunt"]

[tool.coverage.report]
# The mocked suite must not silently regress. Gate sits below the current ~90%.
fail_under = 85
